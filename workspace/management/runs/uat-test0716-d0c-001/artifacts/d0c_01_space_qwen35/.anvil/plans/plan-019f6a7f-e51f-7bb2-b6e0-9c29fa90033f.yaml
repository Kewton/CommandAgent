goal: "Implement the core task-specific behavior for: あなたが考える最高に面白くかっこいいスペースインベーダーゲームを3011ポートで起動可能なnext."
steps:
  - id: "inspect-workspace"
    kind: "verify"
    expected_result: "pass"
    instruction: "Verify the profile-owned package_manifest contract by running every declared check and report any exact failure."
    expected_paths:
      - "package.json"
    verify:
      - "node -p \"['dev'].every(function(k){return String(Object(require('./package.json').scripts)[k]).split(' ').some(function(t,i,a){return t=='next' ? a.slice(i+1).find(function(x){return x})==k : false}) ? String(Object(require('./package.json').scripts)[k]).split(' ').some(function(t,i,a){return t=='--port=3011' ? true : t=='-p' ? a.slice(i+1).find(function(x){return x})=='3011' : t=='-p3011' ? true : t=='--port' ? a.slice(i+1).find(function(x){return x})=='3011' : false}) : false}) ? true : process.exit(1)\""
      - "node -p \"['start'].every(function(k){return Object(require('./package.json').scripts)[k] ? String(Object(require('./package.json').scripts)[k]).split(' ').some(function(t,i,a){return t=='next' ? a.slice(i+1).find(function(x){return x})==k : false}) ? String(Object(require('./package.json').scripts)[k]).split(' ').some(function(t,i,a){return t=='--port=3011' ? true : t=='-p' ? a.slice(i+1).find(function(x){return x})=='3011' : t=='-p3011' ? true : t=='--port' ? a.slice(i+1).find(function(x){return x})=='3011' : false}) : false : true}) ? true : process.exit(1)\""
      - "node -p \"String(require('./package.json').scripts.build)=='next build' ? true : process.exit(1)\""
  - id: "implement-game-core"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create src/app/game-invaders.tsx containing the complete Space Invaders game logic as a React component. Include: canvas-based rendering, player ship controlled by arrow keys, grid of invaders that move side-to-side and descend, player bullets, invader bullets, collision detection, score tracking, lives system, game states (start screen, playing, game over, victory), restart functionality via button and R-key, and data-anvil attributes: data-anvil-action=\"primary\" on start button, data-anvil-action=\"restart\" on all restart buttons (game over, victory, and in-play), data-anvil-state with JSON snapshot including playerX, score, lives, gameStatus, and invaderCount. Export as default component."
    expected_paths:
      - "src/app/game-invaders.tsx"
    verify:
      - "test -f src/app/game-invaders.tsx"
  - id: "implement-game-page"
    kind: "implement"
    expected_result: "pass"
    instruction: "Update src/app/page.tsx to import and render the GameInvaders component from ./game-invaders. Include proper metadata export for title. Ensure the page layout provides a centered game container with Tailwind classes. Update src/app/globals.css to include @tailwind directives and any game-specific CSS for canvas sizing and neon glow effects. Ensure src/app/global.d.ts declares module \"*.css\". Ensure src/app/layout.tsx imports ./globals.css and uses proper metadata.\n\nProfile contract:\nFor the nextjs profile, create a runnable Next.js app, not only package metadata. Keep the project in the workspace root unless a project subdirectory already exists. Required setup scaffold artifacts by completion: package.json, tsconfig.json, postcss.config.js, exactly one tailwind.config.* file, src/app/layout.tsx, src/app/page.tsx, src/app/globals.css, src/app/global.d.ts. If those files are absent, write the coherent App Router scaffold before further inspection. Use tailwind.config.ts for new scaffolds unless exactly one existing Tailwind config is already being completed. src/app/globals.css must contain the @tailwind directives, and src/app/layout.tsx must import ./globals.css. If any layout imports CSS such as ./globals.css, src/app/global.d.ts must declare module \"*.css\". package.json must include compatible next, react, react-dom, @types/react, @types/react-dom, and TypeScript 5.x dependencies plus scripts.build = `next build`. If Tailwind is used, package.json must include tailwindcss/postcss/autoprefixer and postcss.config plugins must include BOTH tailwindcss and autoprefixer. For TypeScript/TSX apps, create tsconfig.json before treating the app as complete. Keep a single route-bound implementation; do not leave capability components unimported. Do not use deprecated moduleResolution=node10 or target=ES5; prefer moduleResolution=bundler and target=ES2017 or newer. For interactive UI, expose task-agnostic observability hooks: data-anvil-action=\"primary\" on the main start/submit/action control, data-anvil-action=\"input\" on the main text entry surface when one exists, and data-anvil-state containing JSON for meaningful visible state after each render. The data-anvil-state snapshot must include at least one dimension that immediately responds to input, such as player/paddle x position."
    expected_paths:
      - "src/app/page.tsx"
      - "src/app/globals.css"
      - "src/app/global.d.ts"
      - "src/app/layout.tsx"
      - "package.json"
    verify:
      - "test -f src/app/page.tsx"
      - "test -f src/app/globals.css"
      - "test -f src/app/global.d.ts"
      - "test -f src/app/layout.tsx"
  - id: "verify-build"
    kind: "verify"
    expected_result: "pass"
    instruction: "Run npm run build to verify the Next.js app compiles successfully with the Space Invaders game implementation."
    expected_paths:
    verify:
      - "npm run build"
