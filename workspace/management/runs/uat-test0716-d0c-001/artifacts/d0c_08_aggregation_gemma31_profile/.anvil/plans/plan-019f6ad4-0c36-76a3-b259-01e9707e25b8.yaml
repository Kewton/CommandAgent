goal: "Original ultra goal: data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。\nProfile: data\nStyle: default\nIntent: create\nPhase id: data-aggregation\nPhase task: Compute the requested aggregates for: data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。. Write output/results.json exactly as: {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Store every numeric claim printed in output/report.md under values. Keep all calculation and reconciliation logic in pipeline/main.py.\n\nWorkspace snapshot:\n- data\n- evidence\n- output\n- pipeline\n- scripts\n\nPrior ultra context:\n- Completed phases:\n  - data-inspection (4/4)\n  - data-cleaning (5/5)\n- Created or changed paths:\n  - scripts/inspect_sales.py\n  - pipeline/main.py`\n  - pipeline/main.py\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- account\n- actual\n- additional\n- against\n- alpha\n- always\n- … and 74 more\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_results_schema"
steps:
  - id: "inspect-workspace"
    kind: "verify"
    expected_result: "pass"
    instruction: "Verify the profile-owned data_manifest_artifact contract by running every declared check and report any exact failure."
    expected_paths:
      - "pipeline/main.py"
      - "output/results.json"
    verify:
      - "test -f pipeline/main.py"
      - "test -f output/results.json"
  - id: "implement-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Overwrite pipeline/main.py to contain deterministic Python code that reads data/sales.csv, filters invalid rows by reason, aggregates monthly and regional sales, computes total sum, and writes output/results.json and output/report.md with strict schema compliance."
    expected_paths:
      - "pipeline/main.py"
    verify:
      - "python -c \"import ast; ast.parse(open('pipeline/main.py').read())\""
  - id: "run-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Execute python pipeline/main.py to generate output/results.json, output/report.md, and output/inspection.json with deterministic ordering and fixed seeds where applicable.\n\nProfile contract:\nBuild one reproducible tabular-data pipeline with Python 3 standard-library csv/json/statistics only. Preserve input files. The canonical artifacts are pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition to report.md.\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nA rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.\nRepair pipeline/main.py and regenerate output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Every numeric claim printed in output/report.md must be present under values. For a claims-binding nearest_miss, report each violation as: \"Report claim <claim> has no corresponding results.json value. Nearest candidate <key>=<value>; absolute difference=<difference>.\" Then export every report numeric claim under an explicit values key, for example regional_名古屋. Never weaken or replace the manifest-bound evidence checks."
    expected_paths:
      - "output/results.json"
      - "output/report.md"
      - "output/inspection.json"
    verify:
  - id: "verify-outputs"
    kind: "verify"
    expected_result: "pass"
    instruction: "Verify the profile-owned data_manifest_artifact contract by running every declared check and report any exact failure."
    expected_paths:
      - "pipeline/main.py"
      - "output/results.json"
    verify:
      - "test -f pipeline/main.py"
      - "test -f output/results.json"
