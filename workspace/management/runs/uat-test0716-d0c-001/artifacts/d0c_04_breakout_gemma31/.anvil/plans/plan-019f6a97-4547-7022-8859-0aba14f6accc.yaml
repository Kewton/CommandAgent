goal: "Implement the core task-specific behavior for: あなたが考える最高に面白くかっこいいブロック崩しゲームを3011ポートで起動可能なnext."
steps:
  - id: "inspect-scaffold"
    kind: "verify"
    expected_result: "pass"
    instruction: "Verify the profile-owned package_manifest contract by running every declared check and report any exact failure."
    expected_paths:
      - "package.json"
    verify:
      - "node -p \"['dev'].every(function(k){return String(Object(require('./package.json').scripts)[k]).split(' ').some(function(t,i,a){return t=='next' ? a.slice(i+1).find(function(x){return x})==k : false}) ? String(Object(require('./package.json').scripts)[k]).split(' ').some(function(t,i,a){return t=='--port=3011' ? true : t=='-p' ? a.slice(i+1).find(function(x){return x})=='3011' : t=='-p3011' ? true : t=='--port' ? a.slice(i+1).find(function(x){return x})=='3011' : false}) : false}) ? true : process.exit(1)\""
      - "node -p \"['start'].every(function(k){return Object(require('./package.json').scripts)[k] ? String(Object(require('./package.json').scripts)[k]).split(' ').some(function(t,i,a){return t=='next' ? a.slice(i+1).find(function(x){return x})==k : false}) ? String(Object(require('./package.json').scripts)[k]).split(' ').some(function(t,i,a){return t=='--port=3011' ? true : t=='-p' ? a.slice(i+1).find(function(x){return x})=='3011' : t=='-p3011' ? true : t=='--port' ? a.slice(i+1).find(function(x){return x})=='3011' : false}) : false : true}) ? true : process.exit(1)\""
      - "node -p \"String(require('./package.json').scripts.build)=='next build' ? true : process.exit(1)\""
  - id: "implement-game-page"
    kind: "implement"
    expected_result: "pass"
    instruction: "Write src/app/page.tsx as a 'use client' Next.js route component containing a complete block breaker game. Implement a canvas-based game loop with requestAnimationFrame, paddle movement via mouse and keyboard, ball physics with wall/brick/paddle collisions, a grid of destructible bricks, scoring, and lives. Add UI overlays for start, game-over, and victory states. Attach data-anvil-state to the game wrapper div with a JSON string containing { paddleX, score, lives, status }. Attach data-anvil-action=\"primary\" to the initial start button. Attach data-anvil-action=\"restart\" to restart buttons in game-over and victory overlays, and bind the 'R' key to trigger restart during gameplay. Use Tailwind utility classes for styling and layout. Ensure proper cleanup of event listeners and animation frames.\n\nProfile contract:\nFor the nextjs profile, create a runnable Next.js app, not only package metadata. Keep the project in the workspace root unless a project subdirectory already exists. Required setup scaffold artifacts by completion: package.json, tsconfig.json, postcss.config.js, exactly one tailwind.config.* file, src/app/layout.tsx, src/app/page.tsx, src/app/globals.css, src/app/global.d.ts. If those files are absent, write the coherent App Router scaffold before further inspection. Use tailwind.config.ts for new scaffolds unless exactly one existing Tailwind config is already being completed. src/app/globals.css must contain the @tailwind directives, and src/app/layout.tsx must import ./globals.css. If any layout imports CSS such as ./globals.css, src/app/global.d.ts must declare module \"*.css\". package.json must include compatible next, react, react-dom, @types/react, @types/react-dom, and TypeScript 5.x dependencies plus scripts.build = `next build`. If Tailwind is used, package.json must include tailwindcss/postcss/autoprefixer and postcss.config plugins must include BOTH tailwindcss and autoprefixer. For TypeScript/TSX apps, create tsconfig.json before treating the app as complete. Keep a single route-bound implementation; do not leave capability components unimported. Do not use deprecated moduleResolution=node10 or target=ES5; prefer moduleResolution=bundler and target=ES2017 or newer."
    expected_paths:
      - "src/app/page.tsx"
      - "package.json"
    verify:
      - "node -p '(function(s,w,b){return [new RegExp(\"data-anvil-state\"+w+\"=\"),new RegExp(\"data-anvil-state\"+b)].some(function(r){return r.test(s)})?true:process.exit(1)})(String(require(\"fs\").readFileSync(\"src/app/page.tsx\")),String.fromCharCode(92)+\"s*\",String.fromCharCode(92)+\"b\")'"
  - id: "verify-build"
    kind: "verify"
    expected_result: "pass"
    instruction: "Run the Next.js build command to verify the application compiles successfully with the new game implementation."
    expected_paths:
    verify:
      - "npm run build"
