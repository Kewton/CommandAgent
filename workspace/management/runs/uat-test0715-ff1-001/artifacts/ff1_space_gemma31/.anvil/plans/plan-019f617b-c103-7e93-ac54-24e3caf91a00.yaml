goal: "Wire controls and data-anvil observability."
steps:
  - id: "inspect-workspace"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read src/app/page.tsx to analyze the current Space Invaders implementation, identify game state variables, control event handlers, and UI overlays for game-over, victory, and in-play states."
    expected_paths:
    verify:
  - id: "implement-data-anvil-wiring"
    kind: "implement"
    expected_result: "pass"
    instruction: "Update src/app/page.tsx to wire controls and data-anvil observability. Add data-anvil-action=\"primary\" to the main start game button. Add data-anvil-action=\"restart\" to all restart/retry/new-game buttons across game-over, victory, and in-play overlays. Add data-anvil-state to the main game container with a JSON snapshot of meaningful visible state (score, playerX, playerY, enemyPositions, gameState) that updates on every render and immediately reflects input changes. Ensure all restart affordances properly reset the observable game state to initial values. Include data-anvil-action=\"input\" on any text entry surface if present.\n\nProfile contract:\nFor the nextjs profile, create a runnable Next.js app, not only package metadata. Keep the project in the workspace root unless a project subdirectory already exists. Required setup scaffold artifacts by completion: package.json, tsconfig.json, postcss.config.js, exactly one tailwind.config.* file, src/app/layout.tsx, src/app/page.tsx, src/app/globals.css, src/app/global.d.ts. If those files are absent, write the coherent App Router scaffold before further inspection. Use tailwind.config.ts for new scaffolds unless exactly one existing Tailwind config is already being completed. src/app/globals.css must contain the @tailwind directives, and src/app/layout.tsx must import ./globals.css. If any layout imports CSS such as ./globals.css, src/app/global.d.ts must declare module \"*.css\". package.json must include compatible next, react, react-dom, @types/react, @types/react-dom, and TypeScript 5.x dependencies plus scripts.build = `next build`. If Tailwind is used, package.json must include tailwindcss/postcss/autoprefixer and postcss.config plugins must include BOTH tailwindcss and autoprefixer. For TypeScript/TSX apps, create tsconfig.json before treating the app as complete. Keep a single route-bound implementation; do not leave capability components unimported. Do not use deprecated moduleResolution=node10 or target=ES5; prefer moduleResolution=bundler and target=ES2017 or newer. For interactive UI, expose task-agnostic observability hooks: data-anvil-action=\"primary\" on the main start/submit/action control, data-anvil-action=\"input\" on the main text entry surface when one exists, and data-anvil-state containing JSON for meaningful visible state after each render. The data-anvil-state snapshot must include at least one dimension that immediately responds to input, such as player/paddle x position."
    expected_paths:
      - "src/app/page.tsx"
      - "package.json"
    verify:
  - id: "verify-build"
    kind: "verify"
    expected_result: "pass"
    instruction: "Run the Next.js build command to ensure the application compiles successfully with the updated game logic and observability hooks."
    expected_paths:
    verify:
      - "npm run build"
