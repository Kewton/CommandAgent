    expected_result: "pass"
    instruction: "Update src/app/page.tsx with a 3-question quiz app featuring score display, retry functionality, and data-anvil observability attributes: data-anvil-action=\"primary\" on start/submit buttons, data-anvil-action=\"input\" on answer selection elements, data-anvil-state with JSON snapshot including currentQuestionIndex and score, and data-anvil-action=\"restart\" on retry buttons for game-over and victory states"
    expected_paths:
      - "src/app/page.tsx"
    verify:
      - "test -f src/app/page.tsx"
