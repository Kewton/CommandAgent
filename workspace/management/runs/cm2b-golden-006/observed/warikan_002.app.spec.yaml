entities:
  - name: expense
    fields:
      participants: list
      amount: number
views:
  - name: expense
    entity: expense
actions:
  - name: createExpense
    entity: expense
validations: []
computed:
  - name: shareAmount
    entity: expense
    expression: amount / len(participants)
    type: number
  - name: netBalance
    entity: expense
    expression: amount - shareAmount
    type: number
  - name: settlementAmount
    entity: expense
    expression: max(0, netBalance)
    type: number
permissions:
  - name: read
    subject: minIdentity
minIdentity:
  mode: anonymous
