entities:
  - name: expense
    fields:
      description: string
      payer: string
      amount: number
      participants: list
views:
  - name: listExpenses
    entity: expense
  - name: viewExpense
    entity: expense
actions:
  - name: addExpense
    entity: expense
  - name: deleteExpense
    entity: expense
validations: []
computed:
  - name: shareAmount
    entity: expense
    expression: amount / len(participants)
    type: number
  - name: netBalance
    entity: expense
    expression: amount - shareAmount
    type: number
  - name: settlementAmount
    entity: expense
    expression: max(0, netBalance)
    type: number
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
