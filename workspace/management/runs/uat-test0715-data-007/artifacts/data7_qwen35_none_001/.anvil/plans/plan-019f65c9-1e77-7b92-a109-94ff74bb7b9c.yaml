goal: "Original ultra goal: data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。\nProfile: data\nStyle: default\nIntent: create\nPhase id: sales-aggregation-and-calculation\nPhase task: Using the validated dataset, compute monthly × regional sales totals and the overall sales total. Ensure deterministic output ordering by sorting results chronologically by month and alphabetically by region. Verify that the grand total matches the sum of all regional monthly subtotals and that no valid data is lost during aggregation.\n\nWorkspace snapshot:\n- data\n- output\n- pipeline\n\nPrior ultra context:\n- Completed phases:\n  - data-ingestion-and-validation (3/3)\n- Created or changed paths:\n  - pipeline/main.py\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- accurately\n- aggregation\n- alphabetically\n- artifact\n- categorize\n- chronologically\n- … and 34 more\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_results_schema"
steps:
  - id: "inspect-workspace"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read data/sales.csv and existing pipeline/main.py to assess data structure, current validation logic, and output requirements."
    expected_paths:
    verify:
  - id: "implement-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Update pipeline/main.py to read data/sales.csv, validate rows, track exclusions by reason, aggregate sales by month and region, sort chronologically by month and alphabetically by region, compute grand total, and write output/inspection.json containing validation logs, output/results.json containing exact schema {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}, and output/report.md containing summary details. Ensure deterministic execution and stable ordering."
    expected_paths:
      - "pipeline/main.py"
    verify:
  - id: "create-smoke-check"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create smoke-check.py containing Python assertions to validate output/results.json schema compliance, verify reconciliation math (input_rows == used_rows + sum of excluded rows), check output/report.md for required summary text, run pipeline/main.py twice, and assert byte-for-byte identical output/results.json across reruns."
    expected_paths:
      - "smoke-check.py"
    verify:
  - id: "run-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Execute python pipeline/main.py to generate output/results.json, output/report.md, and output/inspection.json artifacts.\n\nProfile contract:\nBuild one reproducible tabular-data pipeline with Python 3 standard-library csv/json/statistics only. Preserve input files. The canonical artifacts are pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition to report.md.\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nA rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.\nRepair pipeline/main.py and regenerate output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Every numeric claim printed in output/report.md must be present under values. For a claims-binding nearest_miss, report each violation as: \"Report claim <claim> has no corresponding results.json value. Nearest candidate <key>=<value>; absolute difference=<difference>.\" Then export every report numeric claim under an explicit values key, for example regional_名古屋. Never weaken or replace the manifest-bound evidence checks."
    expected_paths:
      - "output/results.json"
      - "output/report.md"
      - "output/inspection.json"
    verify:
  - id: "verify-results"
    kind: "verify"
    expected_result: "pass"
    instruction: "Run the smoke check script to perform deterministic validation of outputs, schema, reconciliation math, report content, and rerun consistency."
    expected_paths:
      - "pipeline/main.py"
      - "output/results.json"
    verify:
      - "test -f pipeline/main.py"
      - "test -f output/results.json"
