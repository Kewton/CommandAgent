goal: "Original ultra goal: data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。\nProfile: data\nStyle: default\nIntent: create\nPhase id: load-and-validate-data\nPhase task: Load data/sales.csv, inspect its actual structure, and derive validation rules strictly from observed data patterns to identify invalid rows such as missing or malformed dates, non-numeric sales amounts, or unrecognized regions. Filter out invalid rows, record the exclusion reason for each, and output a summary of invalid row counts by reason alongside the cleaned dataset. Verify that the cleaned dataset contains only valid records and that the invalid row counts sum to the total number of excluded rows.\n\nWorkspace snapshot:\n- data\n\nPrior ultra context:\n- Pending final artifacts:\n  - pipeline/main.py\n  - output/inspection.json\n  - output/results.json\n  - output/report.md\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- accurately\n- across\n- actual\n- aggregate\n- aggregation\n- alongside\n- … and 80 more\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_inspection_schema\n- data_results_schema"
steps:
  - id: "inspect-data"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read data/sales.csv to identify column headers, sample rows, date formats, numeric fields, and unique region values. Note any malformed entries or missing values to inform validation rules."
    expected_paths:
    verify:
  - id: "implement-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create pipeline/main.py using only Python 3 standard libraries (csv, json, statistics, datetime, collections). The script must: 1) Read data/sales.csv. 2) Inspect structure and write output/inspection.json with headers, sample rows, unique regions, and observed patterns. 3) Derive validation rules from inspection: valid date format (YYYY-MM-DD), numeric sales amounts, and recognized regions from the observed set. 4) Filter rows, categorizing invalid ones by reason (e.g., invalid_date, non_numeric_sales, unknown_region, missing_fields). 5) Aggregate valid rows by month and region, calculating total sales. 6) Write output/results.json with reconciliation (input_rows, used_rows, excluded list with reasons and counts) and values (aggregation results, invalid counts). Ensure deterministic output by sorting keys and maintaining stable iteration order. 7) Generate output/report.md summarizing the data inspection, validation results, and aggregation findings.\n\nProfile contract:\nBuild one reproducible tabular-data pipeline with Python 3 standard-library csv/json/statistics only. Preserve input files. The canonical artifacts are pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition to report.md.\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nA rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.\nRepair pipeline/main.py and regenerate output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Every numeric claim printed in output/report.md must be present under values. Never weaken or replace the manifest-bound evidence checks."
    expected_paths:
      - "pipeline/main.py"
    verify:
      - "test -f pipeline/main.py"
  - id: "verify-pipeline"
    kind: "verify"
    expected_result: "pass"
    instruction: "Execute pipeline/main.py and validate that output/results.json matches the required schema, reconciliation balances correctly, and output/report.md and output/inspection.json exist."
    expected_paths:
    verify:
      - "anvil-catalog-check:data_results_schema"
      - "anvil-catalog-check:data_reconciliation"
      - "anvil-catalog-check:data_inspection_schema"
