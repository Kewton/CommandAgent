goal: "data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。"
profile: "data"
style: "default"
intent: "create"
phases:
  - id: "load-and-define-validation-rules"
    prompt: "Load data/sales.csv, inspect its schema and sample rows, and define deterministic validation rules to identify invalid records based on missing fields, incorrect data types, or out-of-range values. Verify that the schema matches expected columns and rules cover all invalid cases."
  - id: "filter-and-categorize-invalid-rows"
    prompt: "Apply validation rules to separate valid and invalid rows, categorize invalid rows by specific rejection reasons, and compute exact counts per category. Verify that the sum of valid and invalid counts equals the total row count in data/sales.csv."
  - id: "aggregate-sales-by-month-and-region"
    prompt: "Aggregate valid rows by month and region to calculate sales totals, compute the overall grand total, and sort results deterministically by month then region. Verify that aggregation sums match the raw valid dataset totals."
  - id: "compile-summary-report"
    prompt: "Compile the monthly × regional aggregation table, overall total, and invalid row exclusion summary into a single structured report file. Verify that all required sections are present and the file is saved successfully."
  - id: "verify-report-completeness"
    prompt: "Perform final validation by cross-checking report figures against intermediate calculations, ensuring deterministic output ordering, and confirming the report meets all task requirements before final acceptance."
