goal: "data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。"
profile: "data"
style: "default"
intent: "create"
phases:
  - id: "load-and-validate-sales-data"
    prompt: "data/sales.csvを読み込み列構造を解析し、無効な行を理由別に分類して除外する。除外された行の理由ごとの件数を明記した検証結果を出力し、有効データの構造が集計に適していることを確認する。"
  - id: "aggregate-monthly-regional-sales"
    prompt: "有効なデータのみを対象に、月次×地域ごとの売上合計を計算し、全体の売上合計も算出する。集計結果のグループ分けと合計値の整合性を確認し、後続のレポート生成に必要な構造を出力する。"
  - id: "generate-summary-report"
    prompt: "月次×地域集計結果、全体合計、および無効行の除外理由と件数を統合した要約レポートを作成する。レポートの形式が明確で、数値と件数が集計結果と完全に一致していることを検証する。"
  - id: "final-verification-and-cleanup"
    prompt: "生成された要約レポートがタスク要件（月次×地域集計、全体合計、無効行理由別件数明記）をすべて満たしていることを最終確認し、出力ファイルをクリーンな状態に整えてタスクを完了する。"
