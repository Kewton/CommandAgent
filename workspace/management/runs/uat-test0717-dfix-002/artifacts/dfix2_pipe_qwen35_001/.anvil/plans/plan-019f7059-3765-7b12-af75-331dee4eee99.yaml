rerun_consistency\n- data_results_schema\n\nFix contract phase role: cause_isolation. Inspect and narrow the cause of the observed failure without writing, editing, setting up, installing, or repairing.\n\nFix F1 failure diagnostic (runtime-derived):\n- location: pipeline/main.py:53\n- error kind: ValueError\n- message: invalid literal for int() with base 10: ''\n- write-pressure target: pipeline/main.py (selection_reason=traceback_mapped)\n- excerpt: /Users/<user>/share/work/localwork/commandagent_mvp/01/test0717_dfix_002/runs/dfix2_pipe_qwen35_001/pipeline/main.py:53 in parse_amount"
