lts_schema\n\nFix contract phase role: reproducer_before. Return exactly one verify step, expected_result=\"fail\", with exactly one deterministic verify command. Declare no expected_paths and do not inspect, write, edit, set up, install, or repair anything. The runtime executes this command directly before any repair.\n\nFix contract section 8 reproducer suggestion (guidance, not enforcement):\n- basis: goal_failure_kind:pipeline_execution\n- canonical candidate: profile_catalog:pipeline_probe(entry=pipeline/main.py) => python3 -B pipeline/main.py\nUse this candidate when it represents the stated failure. A different deterministic R remains permitted; the F1 baseline gate remains authoritative."
