goal: "Original ultra goal: 友だちとの旅行のお金をあとで揉めないように割り勘できる小さなアプリを作って。誰が何を払ったかはざっくり入力できて、最後に誰が誰へいくら渡せばいいか見たい。\nProfile: community-mini-app\nStyle: default\nIntent: create\nPhase id: spec-generation-l2\nPhase task: Generate app.spec.yaml following L2 constraints with entities, views, actions, validations, computed, permissions, and minIdentity. Define models for users, expenses, and settlement pairs. Specify a simple expense entry view, a settlement results view, and computed fields for net balances and optimal pairwise transfers. Verify the spec is complete, statically typed, and matches all required L2 sections without inferring or weakening the platform-owned schema.\n\nWorkspace snapshot:\n- .bench-product-stderr\n- .bench-product-stdout\n- uat-console.log\n\nPrior ultra context:\n- Pending final artifacts:\n  - app.spec.yaml\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- actions\n- amount\n- are\n- avoid\n- balances\n- based\n- … and 106 more\n\nProfile generation rules:\nCommunity Mini App generation rules (DATA-1):\n- L2 is the default and must be attempted first; generate exactly app.spec.yaml with entities/views/actions/validations/computed/permissions/minIdentity.\n- Promote to L3/L4 only under src/app-zone/ and record a machine-readable promotion_decision with the lower-level result and reason.\n- The platform-owned schema is a pinned input; never replace, weaken, or infer it.\n- Core paths are immutable. Do not use process.env, eval, child_process, raw fetch, dynamic import, undeclared packages, or build-time egress.\n- Keep computed expressions bounded, statically typed, and inside the registered pure-function set.\n\nProfile runtime contract:\n- Keep the Community Mini App at the lowest level that satisfies the goal.\n- Emit app.spec.yaml for L1/L2; use src/app-zone/ only with promotion_decision evidence.\nPre-provisioned scaffold note:\n- Required scaffold files are authored before phase 1 when absent; verify or extend the scaffold rather than re-planning file creation.\nDeterministic verification preference:\n- test -f app.spec.yaml\n\n\nRequired final artifacts:\n- app.spec.yaml"
steps:
  - id: "generate-spec-and-check"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create app.spec.yaml containing entities (User, Expense, Settlement), views (ExpenseEntryView, SettlementResultsView), actions (AddExpense, CalculateSettlement), validations (positive amounts, valid participant references), computed fields (net balances, optimal pairwise transfers), permissions (read/write for group members), and minIdentity (email, name). Ensure all types are statically defined and comply with the platform-owned L2 schema. Also create smoke-check.js that reads app.spec.yaml and exits 0 if all required L2 sections are present, else exits 1.\n\nProfile contract:\nCommunity Mini App generation rules (DATA-1):\n- L2 is the default and must be attempted first; generate exactly app.spec.yaml with entities/views/actions/validations/computed/permissions/minIdentity.\n- Promote to L3/L4 only under src/app-zone/ and record a machine-readable promotion_decision with the lower-level result and reason.\n- The platform-owned schema is a pinned input; never replace, weaken, or infer it.\n- Core paths are immutable. Do not use process.env, eval, child_process, raw fetch, dynamic import, undeclared packages, or build-time egress.\n- Keep computed expressions bounded, statically typed, and inside the registered pure-function set.\n"
    expected_paths:
      - "app.spec.yaml"
      - "smoke-check.js"
    verify:
      - "test -f app.spec.yaml"
  - id: "verify-spec-completeness"
    kind: "verify"
    expected_result: "pass"
    instruction: "Run smoke-check.js to deterministically verify app.spec.yaml contains all mandatory L2 sections."
    expected_paths:
    verify:
      - "node smoke-check.js"
