goal: "Original ultra goal: data/sales.csv を読み込み、月次の売上合計・前月比（%）・3ヶ月移動平均を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。\nProfile: data\nStyle: default\nIntent: create\nPhase id: data-validation-and-cleaning\nPhase task: Load data/sales.csv and identify all invalid rows. Categorize exclusions by reason (e.g., missing/invalid dates, non-numeric sales values, duplicate entries, or out-of-range months) and count them. Output a cleaned dataset and a structured summary of excluded row counts by reason. Verify that the cleaned dataset contains only valid, complete records ready for aggregation.\n\nWorkspace snapshot:\n- data\n\nPrior ultra context:\n- Pending final artifacts:\n  - pipeline/main.py\n  - output/inspection.json\n  - output/results.json\n  - output/report.md\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- accurately\n- aggregation\n- align\n- appropriately\n- are\n- average\n- … and 72 more\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_results_schema"
steps:
  - id: "inspect-data"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read data/sales.csv to identify column structure, data types, and sample rows. Note any obvious formatting issues or edge cases for validation rules."
    expected_paths:
    verify:
  - id: "implement-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create pipeline/main.py containing a Python 3 script using only standard library modules (csv, json, os, pathlib, statistics). The script must load data/sales.csv, validate each row for missing/invalid dates, non-numeric sales values, duplicates, and out-of-range months. It will categorize and count exclusions by reason, write output/inspection.json with schema observations, output/results.json with the exact reconciliation and values schema, and output/report.md with a markdown summary of exclusions and cleaned data counts. Ensure deterministic ordering and fixed seeds where applicable."
    expected_paths:
      - "pipeline/main.py"
    verify:
      - "test -f pipeline/main.py"
  - id: "run-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Execute python pipeline/main.py to generate the output artifacts. The script will produce output/inspection.json, output/results.json, and output/report.md containing the validation summary and reconciliation data.\n\nProfile contract:\nBuild one reproducible tabular-data pipeline with Python 3 standard-library csv/json/statistics only. Preserve input files. The canonical artifacts are pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition to report.md.\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nA rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.\nRepair pipeline/main.py and regenerate output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Every numeric claim printed in output/report.md must be present under values. For a claims-binding nearest_miss, report each violation as: \"Report claim <claim> has no corresponding results.json value. Nearest candidate <key>=<value>; absolute difference=<difference>.\" Then export every report numeric claim under an explicit values key, for example regional_名古屋. Never weaken or replace the manifest-bound evidence checks."
    expected_paths:
      - "output/inspection.json"
      - "output/results.json"
      - "output/report.md"
    verify:
      - "test -f output/results.json"
  - id: "verify-schema"
    kind: "verify"
    expected_result: "pass"
    instruction: "Validate that output/results.json conforms to the required schema and that input_rows equals used_rows plus the sum of excluded rows. Check that output/report.md exists and contains the reconciliation summary."
    expected_paths:
      - "pipeline/main.py"
    verify:
      - "test -f pipeline/main.py"
