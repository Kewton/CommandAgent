goal: "Apply the focused repair for the reproduced failure in: このNext."
steps:
  - id: "inspect-page-source"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read src/app/page.tsx to identify all UI elements, overlays, and event handlers responsible for restarting the game or resetting state, focusing on the area around the keydown listener and any restart buttons.\n\nFix F1 profile contract predicate (runtime-bound):\n- capability: hook_attribute_present\n- write-pressure target: src/app/page.tsx (selection_reason=contract_attribute)\n\nContract attribute repair guidance:\n- classification: contract_attribute_missing\n- missing attribute: `data-anvil-action=\"restart\"`\n- target source file: `src/app/page.tsx`\n- contract requirement: mark every restart, retry, or new-game affordance that resets observable state; the primary action alone is not restart evidence.\n- location directive: add the missing attribute to the route-bound container, control, or status element in the same rendered hierarchy as the existing hooks below.\nExisting hook locations:\n- no existing data-anvil hook lines found; likely insertion area\n- near line 41\n    39 |     };\n    40 |     window.addEventListener(\"keydown\", onKey);\n    41 |     return () => window.removeEventListener(\"keydown\", onKey);\n    42 |   }, [player]);\n    43 |\nGeneric one-line example:\n- data-anvil-action=\"restart\""
    expected_paths:
    verify:
  - id: "add-restart-hook"
    kind: "implement"
    expected_result: "pass"
    instruction: "Edit src/app/page.tsx to add the attribute data-anvil-action=\"restart\" to every button, link, or interactive element that triggers a game reset or restart. If the restart is triggered solely by a keyboard shortcut, ensure the main game container or a dedicated restart overlay carries this attribute. Preserve existing data-anvil-action=\"primary\" and data-anvil-state hooks.\n\nProfile contract:\nFor the nextjs profile, create a runnable Next.js app, not only package metadata. Keep the project in the workspace root unless a project subdirectory already exists. Required setup scaffold artifacts by completion: package.json, tsconfig.json, postcss.config.js, exactly one tailwind.config.* file, src/app/layout.tsx, src/app/page.tsx, src/app/globals.css, src/app/global.d.ts. If those files are absent, write the coherent App Router scaffold before further inspection. Use tailwind.config.ts for new scaffolds unless exactly one existing Tailwind config is already being completed. src/app/globals.css must contain the @tailwind directives, and src/app/layout.tsx must import ./globals.css. If any layout imports CSS such as ./globals.css, src/app/global.d.ts must declare module \"*.css\". package.json must include compatible next, react, react-dom, @types/react, @types/react-dom, and TypeScript 5.x dependencies plus scripts.build = `next build`. If Tailwind is used, package.json must include tailwindcss/postcss/autoprefixer and postcss.config plugins must include BOTH tailwindcss and autoprefixer. For TypeScript/TSX apps, create tsconfig.json before treating the app as complete. Keep a single route-bound implementation; do not leave capability components unimported. Do not use deprecated moduleResolution=node10 or target=ES5; prefer moduleResolution=bundler and target=ES2017 or newer. For interactive UI, expose task-agnostic observability hooks: data-anvil-action=\"primary\" on the main start/submit/action control, data-anvil-action=\"input\" on the main text entry surface when one exists, and data-anvil-state containing JSON for meaningful visible state after each render. The data-anvil-state snapshot must include at least one dimension that immediately responds to input, such as player/paddle x position. When the contract includes start_or_restart_flow, every restart affordance (game-over, victory, and in-play when present) should carry data-anvil-action=\"restart\"; the initial primary action alone cannot satisfy recovery verification.\n\nFix F1 profile contract predicate (runtime-bound):\n- capability: hook_attribute_present\n- write-pressure target: src/app/page.tsx (selection_reason=contract_attribute)\n\nContract attribute repair guidance:\n- classification: contract_attribute_missing\n- missing attribute: `data-anvil-action=\"restart\"`\n- target source file: `src/app/page.tsx`\n- contract requirement: mark every restart, retry, or new-game affordance that resets observable state; the primary action alone is not restart evidence.\n- location directive: add the missing attribute to the route-bound container, control, or status element in the same rendered hierarchy as the existing hooks below.\nExisting hook locations:\n- no existing data-anvil hook lines found; likely insertion area\n- near line 41\n    39 |     };\n    40 |     window.addEventListener(\"keydown\", onKey);\n    41 |     return () => window.removeEventListener(\"keydown\", onKey);\n    42 |   }, [player]);\n    43 |\nGeneric one-line example:\n- data-anvil-action=\"restart\""
    expected_paths:
      - "src/app/page.tsx"
      - "package.json"
    verify:
      - "node -p '(function(s,w,d,q,b){return [new RegExp(\"data-anvil-action\"+w+\"=\"+w+d+\"restart\"+d),new RegExp(\"data-anvil-action\"+w+\"=\"+w+q+\"restart\"+q),new RegExp(\"data-anvil-action\"+w+\"=\"+w+\"[{]\"+w+d+\"restart\"+d+w+\"[}]\"),new RegExp(\"data-anvil-action\"+w+\"=\"+w+\"[{]\"+w+q+\"restart\"+q+w+\"[}]\"),new RegExp(\"data-anvil-action\"+w+\"=\"+w+\"[{]\"+w+b+\"restart\"+b+w+\"[}]\")].some(function(r){return r.test(s)})?true:process.exit(1)})(String(require(\"fs\").readFileSync(\"src/app/page.tsx\")),String.fromCharCode(92)+\"s*\",String.fromCharCode(34),String.fromCharCode(39),String.fromCharCode(96))'"
  - id: "verify-build"
    kind: "verify"
    expected_result: "pass"
    instruction: "Run the Next.js build to ensure the application compiles successfully and the contract attribute does not break the build process."
    expected_paths:
    verify:
      - "npm run build"
