goal: "data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。"
profile: "data"
style: "default"
intent: "create"
phases:
  - id: "data-inspection"
    prompt: "Inspect the workspace CSV or TSV input for: data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。. Write output/inspection.json with column names, input row count, type summaries, distinct observed values for every categorical column (for example the actual region values), and sample rows. Derive later validation rules such as valid regions and date formats only from output/inspection.json observations; never invent an unobserved value set. Verify this phase without depending on pipeline/main.py, output/results.json, or output/report.md."
  - id: "data-cleaning"
    prompt: "Implement deterministic cleaning in pipeline/main.py for: data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。. Read only the inspected workspace data input, account for every excluded row by a non-empty reason, preserve raw input files, and use Python 3 standard-library csv/json/statistics only. Derive validation rules from output/inspection.json observations and never invent unobserved regions, date formats, or category sets."
  - id: "data-aggregation"
    prompt: "Compute the requested aggregates for: data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。. Write output/results.json exactly as: {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Store every numeric claim printed in output/report.md under values. Keep all calculation and reconciliation logic in pipeline/main.py."
  - id: "data-reporting"
    prompt: "Generate the required output/report.md from output/results.json; output/report.html is an optional additional artifact. output/results.json must remain exactly: {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Store every numeric claim printed in the report under values and interpolate it from those values; never write an independent numeric literal in report prose."
  - id: "data-validation"
    prompt: "Run only the manifest-bound inspection-schema, pipeline, results-schema, reconciliation, claims-binding, and rerun-consistency checks against the canonical artifacts. The inspection-phase verification must depend only on the input data and output/inspection.json, never on later-phase artifacts. Do not claim full assurance unless every bound check passes from observed artifacts."
