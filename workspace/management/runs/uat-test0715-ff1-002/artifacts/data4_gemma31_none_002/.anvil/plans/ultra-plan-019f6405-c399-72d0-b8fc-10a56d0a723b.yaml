goal: "data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。"
profile: "data"
style: "default"
intent: "create"
phases:
  - id: "inspect-and-define-schema"
    prompt: "Load and inspect data/sales.csv to identify column structures and derive validation rules strictly from observed data patterns. Output a data profile summary and verify that all columns are recognized and validation criteria are explicitly documented without inventing unobserved value sets."
  - id: "clean-and-categorize-exclusions"
    prompt: "Filter data/sales.csv to remove invalid rows, categorize each exclusion by specific reason, count exclusions per reason, and produce a cleaned dataset. Verify that exclusion counts are accurate and the cleaned dataset contains only valid records."
  - id: "aggregate-sales-by-month-and-region"
    prompt: "Aggregate the cleaned dataset by month and region to calculate sales totals, compute the overall grand total, and sort results deterministically by month then region. Verify that aggregation sums match the cleaned dataset and output ordering is stable."
  - id: "generate-summary-report"
    prompt: "Create a structured summary report containing the month×region sales table, overall total, and a detailed invalid row exclusion summary with reasons and counts. Verify that the report is well-formatted, matches the aggregated data, and explicitly lists all exclusion categories and counts."
  - id: "final-validation-and-acceptance"
    prompt: "Cross-check the summary report's totals and exclusion counts against the processed data, ensure deterministic output ordering, and confirm all task requirements are satisfied. Output a final acceptance confirmation with verification results."
