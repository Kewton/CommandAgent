goal: "Original ultra goal: data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。\nProfile: data\nStyle: default\nIntent: create\nPhase id: inspect-and-define-schema\nPhase task: Load and inspect data/sales.csv to identify column structures and derive validation rules strictly from observed data patterns. Output a data profile summary and verify that all columns are recognized and validation criteria are explicitly documented without inventing unobserved value sets.\n\nWorkspace snapshot:\n- data\n\nPrior ultra context:\n- Pending final artifacts:\n  - pipeline/main.py\n  - output/inspection.json\n  - output/results.json\n  - output/report.md\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- accurate\n- against\n- aggregate\n- aggregated\n- aggregation\n- are\n- … and 85 more\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_inspection_schema\n- data_results_schema"
steps:
  - id: "setup-directories"
    kind: "setup"
    expected_result: "pass"
    instruction: "Create the pipeline and output directories to prepare for artifact generation."
    expected_paths:
      - "pipeline"
      - "output"
    verify:
  - id: "implement-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create pipeline/main.py. The script must read data/sales.csv, inspect the schema to derive validation rules, validate rows, aggregate sales by month and region, reconcile row counts, and write output/inspection.json, output/results.json, and output/report.md. Ensure deterministic output ordering."
    expected_paths:
      - "pipeline/main.py"
    verify:
  - id: "implement-checker"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create verify_outputs.py. The script must load output/results.json, assert 'reconciliation' and 'values' keys exist, verify that reconciliation.input_rows equals reconciliation.used_rows plus the sum of excluded rows, and check that output/report.md and output/inspection.json exist."
    expected_paths:
      - "verify_outputs.py"
    verify:
  - id: "run-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Execute python pipeline/main.py to generate the required output artifacts.\n\nProfile contract:\nBuild one reproducible tabular-data pipeline with Python 3 standard-library csv/json/statistics only. Preserve input files. The canonical artifacts are pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition to report.md.\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nA rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.\nRepair pipeline/main.py and regenerate output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Every numeric claim printed in output/report.md must be present under values. Never weaken or replace the manifest-bound evidence checks."
    expected_paths:
      - "output/inspection.json"
      - "output/results.json"
      - "output/report.md"
    verify:
  - id: "verify-results"
    kind: "verify"
    expected_result: "pass"
    instruction: "Run the verification script to validate output structure and reconciliation logic."
    expected_paths:
    verify:
      - "anvil-catalog-check:data_reconciliation"
