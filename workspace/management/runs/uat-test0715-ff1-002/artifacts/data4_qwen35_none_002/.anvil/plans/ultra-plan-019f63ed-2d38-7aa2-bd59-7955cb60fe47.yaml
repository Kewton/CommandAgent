goal: "data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。"
profile: "data"
style: "default"
intent: "create"
phases:
  - id: "load-and-validate-data"
    prompt: "data/sales.csv を読み込み、カラム構造を解析する。無効な行を理由別（日付形式不一致、必須カラム欠損、売上値の型不一致・範囲外など）に分類し、各理由の件数を正確にカウント。処理順序とフィルタリングロジックを固定して再現性を確保し、検証可能な中間結果を出力する。"
  - id: "aggregate-sales"
    prompt: "有効な行のみを対象に、月次×地域ごとの売上合計を計算し、全レコードの全体合計を算出する。集計結果を地域・月順でソートし、計算ロジックの決定性を保証した上で、構造化された集計テーブルと合計値を出力する。"
  - id: "generate-report"
    prompt: "無効行の除外理由と件数明細、月次×地域集計結果、全体合計を統合し、見出し・表・要約セクションが明確な要約レポートを output/sales_summary_report.md に生成する。出力形式とセクション構成を固定し、内容の整合性を確認する。"
  - id: "verify-and-finalize"
    prompt: "生成された output/sales_summary_report.md の形式整合性、数値の再計算検証、要件（集計・合計・無効行明記）の網羅性を確認し、最終出力を確定する。"
