goal: "Original ultra goal: data/sales.csv を読み込み、月次の売上合計・前月比（%）・3ヶ月移動平均を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。\nProfile: data\nStyle: default\nIntent: create\nPhase id: data-cleaning\nPhase task: Implement deterministic cleaning in pipeline/main.py for: data/sales.csv を読み込み、月次の売上合計・前月比（%）・3ヶ月移動平均を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。. Read only the inspected workspace data input, account for every excluded row by a non-empty reason, preserve raw input files, and use Python 3 standard-library csv/json/statistics only. Derive validation rules from output/inspection.json observations and never invent unobserved regions, date formats, or category sets.\n\nWorkspace snapshot:\n- data\n- evidence\n- output\n- pipeline\n\nPrior ultra context:\n- Completed phases:\n  - data-inspection (4/4)\n- Created or changed paths:\n  - output/inspection.json\n  - pipeline/main.py\n- Recent repair changed paths:\n  - output/inspection.json\n- Pending final artifacts:\n  - output/results.json\n  - output/report.md\n- Unresolved repair targets:\n  - implementation\n  - unknown\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- account\n- actual\n- additional\n- against\n- aggregates\n- alpha\n- … and 84 more\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_results_schema"
steps:
  - id: "inspect-workspace"
    kind: "verify"
    expected_result: "pass"
    instruction: "Verify the profile-owned data_manifest_artifact contract by running every declared check and report any exact failure."
    expected_paths:
      - "pipeline/main.py"
    verify:
      - "test -f pipeline/main.py"
  - id: "implement-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Rewrite pipeline/main.py using Python 3 standard library (csv, json, statistics, collections, datetime) to: 1) Load data/sales.csv. 2) Validate each row against rules derived strictly from output/inspection.json observations, tracking excluded rows by specific non-empty reasons without inventing unobserved value sets. 3) Aggregate valid rows by month to compute monthly sales totals. 4) Calculate month-over-month percentage change and 3-month moving averages for the sales totals. 5) Generate output/results.json with exact schema {\"reconciliation\": {\"input_rows\": N, \"used_rows\": N, \"excluded\": [{\"reason\": \"...\", \"rows\": N}]}, \"values\": {\"<claim_key>\": number}} ensuring deterministic key ordering and stable iteration. 6) Generate output/report.md summarizing the cleaning process, exclusion counts, and calculated metrics, binding every numeric claim to a corresponding key in values. Create pipeline/main.py that executes pipeline/main.py, loads output/results.json to assert schema validity and reconciliation math (input_rows == used_rows + sum(excluded rows)), parses output/report.md to verify claims binding, and exits 0 on success or 1 on failure.\n\nProfile contract:\nBuild one reproducible tabular-data pipeline with Python 3 standard-library csv/json/statistics only. Preserve input files. The canonical artifacts are pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition to report.md.\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nA rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.\nRepair pipeline/main.py and regenerate output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Every numeric claim printed in output/report.md must be present under values. For a claims-binding nearest_miss, report each violation as: \"Report claim <claim> has no corresponding results.json value. Nearest candidate <key>=<value>; absolute difference=<difference>."
    expected_paths:
      - "pipeline/main.py"
      - "output/results.json"
      - "output/report.md"
    verify:
  - id: "verify-pipeline"
    kind: "verify"
    expected_result: "pass"
    instruction: "Verify the profile-owned data_manifest_artifact contract by running every declared check and report any exact failure."
    expected_paths:
      - "pipeline/main.py"
    verify:
      - "test -f pipeline/main.py"
