goal: "Original ultra goal: data/sales.csv を読み込み、月次の売上合計・前月比（%）・3ヶ月移動平均を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。\nProfile: data\nStyle: default\nIntent: create\nPhase id: data-validation-and-cleaning\nPhase task: Load data/sales.csv, parse dates and sales values, identify invalid rows by reason (e.g., missing/invalid date, non-numeric sales, duplicates), count exclusions per reason, and save the cleaned dataset and validation summary to output/cleaned_sales.csv and output/validation_summary.json. Ensure deterministic row ordering and explicit exclusion counts.\n\nWorkspace snapshot:\n- data\n\nPrior ultra context:\n- Pending final artifacts:\n  - pipeline/main.py\n  - output/inspection.json\n  - output/results.json\n  - output/report.md\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- average\n- brief\n- calculations\n- cases\n- change\n- cleaned\n- … and 62 more\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_results_schema"
steps:
  - id: "inspect-workspace"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read data/sales.csv to understand column names, date formats, and data types. Check for existing files in output/ and pipeline/ directories."
    expected_paths:
    verify:
  - id: "implement-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create pipeline/main.py. The script must deterministically read data/sales.csv, parse dates and sales values, identify invalid rows by reason (missing/invalid date, non-numeric sales, duplicates), and count exclusions per reason. It must calculate monthly sales totals, month-over-month percentage change, and 3-month moving averages. It must save cleaned data to output/cleaned_sales.csv, validation summary to output/validation_summary.json, inspection results to output/inspection.json, reconciliation and claims to output/results.json, and a summary report to output/report.md. Ensure deterministic row ordering and explicit exclusion counts. output/results.json must exactly match the schema {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}."
    expected_paths:
      - "pipeline/main.py"
    verify:
  - id: "run-pipeline"
    kind: "implement"
    expected_result: "pass"
    instruction: "Execute python pipeline/main.py to generate all output artifacts. Ensure the script runs without errors and produces deterministic output files in the output/ directory."
    expected_paths:
      - "output/inspection.json"
      - "output/cleaned_sales.csv"
      - "output/validation_summary.json"
      - "output/results.json"
      - "output/report.md"
    verify:
  - id: "implement-smoke-check"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create smoke-check.py that validates output/results.json contains reconciliation and values keys, checks that input_rows equals used_rows plus sum of excluded rows, verifies output/cleaned_sales.csv has headers and data rows, confirms output/validation_summary.json is valid JSON, and asserts output/report.md contains summary text. Exit with 0 on success, 1 on failure.\n\nProfile contract:\nBuild one reproducible tabular-data pipeline with Python 3 standard-library csv/json/statistics only. Preserve input files. The canonical artifacts are pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition to report.md.\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nA rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.\nRepair pipeline/main.py and regenerate output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}}. Every numeric claim printed in output/report.md must be present under values. For a claims-binding nearest_miss, report each violation as: \"Report claim <claim> has no corresponding results.json value. Nearest candidate <key>=<value>; absolute difference=<difference>.\" Then export every report numeric claim under an explicit values key, for example regional_名古屋. Never weaken or replace the manifest-bound evidence checks."
    expected_paths:
      - "smoke-check.py"
    verify:
  - id: "verify-outputs"
    kind: "verify"
    expected_result: "pass"
    instruction: "Run the smoke check script to deterministically validate all generated artifacts against the required schema and content constraints."
    expected_paths:
      - "pipeline/main.py"
    verify:
      - "test -f pipeline/main.py"
