goal: "Original ultra goal: data/sales.csv を読み込み、月次の売上合計・前月比（%）・3ヶ月移動平均を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。\nProfile: data\nStyle: default\nIntent: create\nPhase id: data-inspection\nPhase task: Inspect the workspace CSV or TSV input for: data/sales.csv を読み込み、月次の売上合計・前月比（%）・3ヶ月移動平均を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。. Write output/inspection.json with column names, input row count, type summaries, distinct observed values for every categorical column, and sample rows. Always write output/inspection.json in this literal shape: {\"column_names\": [\"recorded_at\",\"category\",\"metric\"], \"input_row_count\": 3, \"type_summaries\": {\"recorded_at\":\"string\",\"category\":\"string\",\"metric\":\"number\"}, \"distinct_values\": {\"category\": [\"alpha\",\"beta\"]}, \"sample_rows\": [{\"recorded_at\":\"example-1\",\"category\":\"alpha\",\"metric\":1}]}. The values shown are examples only: fill every field with actual observed values from the input data, and never copy the example values as fixed data. Derive later validation rules such as categorical values and field formats only from output/inspection.json observations; never invent an unobserved value set. Verify this phase without depending on pipeline/main.py, output/results.json, or output/report.md.\n\nWorkspace snapshot:\n- data\n\nPrior ultra context:\n- Pending final artifacts:\n  - pipeline/main.py\n  - output/inspection.json\n  - output/results.json\n  - output/report.md\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- account\n- actual\n- additional\n- against\n- aggregates\n- alpha\n- … and 121 more\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_results_schema"
