    verify:
  - id: "inspect-report-claims"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read output/report.md to extract numeric claims. Check if every numeric claim has a corresponding key in results.json values. Identify claims-binding violations or missing values keys."
