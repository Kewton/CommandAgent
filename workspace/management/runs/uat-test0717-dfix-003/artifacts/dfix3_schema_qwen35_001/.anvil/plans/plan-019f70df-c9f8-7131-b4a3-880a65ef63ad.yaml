goal: "Original ultra goal: output/results.json がデータ契約のスキーマ検証に失敗します。パイプラインを修正して正しい results.json を再生成し、既存検証が通ることを確認してください。\nProfile: data\nStyle: default\nIntent: fix\nPhase id: isolate-cause\nPhase task: Isolate the cause of the reproduced failure without modifying the workspace for: output/results.json がデータ契約のスキーマ検証に失敗します。パイプラインを修正して正しい results.json を再生成し、既存検証が通ることを確認してください。\n\nWorkspace snapshot:\n- data\n- evidence\n- output\n- pipeline\n\nPrior ultra context:\n- Pending final artifacts:\n  - output/inspection.json\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- any\n- apply\n- before\n- behavior\n- bind\n- bound\n- … and 21 more\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_results_schema\n\nFix contract phase role: cause_isolation. Inspect and narrow the cause of the observed failure without writing, editing, setting up, installing, or repairing.\n\nData fix cause-isolation artifact policy (runtime-bound):\n- Use the executed F1 evidence above and files present in the workspace snapshot as the primary diagnostic inputs.\n- Existing canonical artifacts allowed for read-only inspection:\n- pipeline/main.py\n- output/results.json\n- output/report.md\n- Absent canonical artifacts: do not request, inspect, verify, create, or expect these during isolate-cause:\n- output/inspection.json\n- Defer creation or regeneration of absent final artifacts to the repair phase.\n\nData fix phase-role boundary (runtime-bound):\n- Return read-only cause-isolation steps only; do not place implementation, file edits, artifact generation, or repair verification in this phase.\n- Put every workspace-changing action in the later repair phase, where implement steps receive write authority."
