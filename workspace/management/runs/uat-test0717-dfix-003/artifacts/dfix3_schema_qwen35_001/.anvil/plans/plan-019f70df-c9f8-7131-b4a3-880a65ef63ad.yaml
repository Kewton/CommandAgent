  - id: "isolate-cause-analysis"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Correlate findings from previous steps to isolate the exact cause of the schema validation failure. Determine if the issue stems from missing reconciliation structure, incorrect data types, unbound report claims, or pipeline logic errors."
