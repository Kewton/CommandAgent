goal: "data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。"
profile: "data"
style: "default"
intent: "create"
phases:
  - id: "data-ingestion-and-validation"
    prompt: "data/sales.csv を読み込み、必須フィールドの欠損・型不一致・範囲外値を検出し、無効行を理由別に分類・カウントする前処理ロジックを実装し、有効行のみを保持する中間データセットを出力する。"
  - id: "sales-aggregation"
    prompt: "有効データセットから月次×地域ごとの売上合計を計算し、全体合計を算出する集計モジュールを実装し、集計結果が元の有効行の合計と一致することを確認する。"
  - id: "report-generation"
    prompt: "月次×地域集計表、全体合計、無効行の理由別除外件数を統合した要約レポートを生成し、指定された出力形式で保存する。"
  - id: "final-verification"
    prompt: "生成された要約レポートの構造と数値が集計ロジックと除外結果と完全に一致することを確認し、出力の決定性と安定性を検証する。"
