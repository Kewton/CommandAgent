[goals]
warikan_main = "友だちとの旅行のお金をあとで揉めないように割り勘できる小さなアプリを作って。誰が何を払ったかはざっくり入力できて、最後に誰が誰へいくら渡せばいいか見たい。"
warikan_late = "家族で立て替えが多くなったので、レシートを全部きれいに入れなくても、参加者と支払った金額からなるべく簡単に精算できる画面がほしい。"
warikan_mixed = "飲み会の割り勘をスマホでやりたいです。途中で人数が増えたり、払ってない人がいたりしても後から直せる感じでお願いします。"
mochimono_main = "キャンプに持っていくものをみんなで相談できるリストを作りたいです。誰が持ってくるか決められて、足りないものがなんとなく分かれば十分です。"
mochimono_late = "子どもの合宿の持ち物、去年のままだと多分足りないので、家にある物と買う物を家族で更新できるようにして。"
mochimono_mixed = "友人との旅行の荷物を共有したい。担当を決めても忘れるので、持ったかどうかも気軽にチェックできる画面がいいです。"
vote_main = "週末にどこへ行くか決められないので、みんなが候補を出して一票ずつ入れられるものを作って。結果はあとで見返せればいいです。"
vote_late = "友だちの予定を聞くと返信がばらばらになるから、行きたい場所をいくつか並べて投票できる簡単なページがほしい。"
vote_mixed = "家族会議で夕飯を決めるのに使いたいです。途中で候補を追加しても、誰が投票したかは重く考えずに済む感じで。"

