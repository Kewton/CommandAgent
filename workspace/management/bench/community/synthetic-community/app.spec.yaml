entities:
  - name: counter
    fields:
      count: number
views:
  - name: count
    entity: counter
actions:
  - name: increment
    entity: counter
  - name: reset
    entity: counter
validations:
  - name: countNonNegative
    expression: count >= 0
computed:
  - name: countPlusOne
    entity: counter
    expression: count + 1
    type: number
permissions:
  - name: read
    subject: minIdentity
minIdentity:
  mode: anonymous
