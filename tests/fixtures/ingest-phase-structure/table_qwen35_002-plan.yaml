    instruction: "Create pipeline/main.py that reads all HTML files in data/snapshots/, applies explicit CSS selectors to locate event blocks, extracts name, date (normalized to YYYY-MM-DD), location, and source_file, and writes output/records.json, output/inspection.json (with candidate_selector, candidate_accounting, record_format), and output/report.md."
    expected_paths:
      - "pipeline/main.py"
    verify: []
  - id: "run-pipeline"
    kind: "implement"
