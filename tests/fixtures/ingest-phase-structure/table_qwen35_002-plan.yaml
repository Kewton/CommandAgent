    verify: []
  - id: "create-verify-script"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create verify_pipeline.py that loads output/records.json and asserts each record contains name, date (YYYY-MM-DD), location, source_file; loads output/inspection.json and asserts candidate_selector exists; reads output/report.md and asserts it is non-empty."
    expected_paths:
      - "verify_pipeline.py"
    verify: []
  - id: "verify-results"
