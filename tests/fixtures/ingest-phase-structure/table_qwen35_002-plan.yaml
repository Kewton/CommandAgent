goal: "Original ultra goal: data/snapshots/ 配下のHTMLから自治体イベント情報を抽出し、JSON形式（フィールド: name, date (YYYY-MM-DD), location, source_file）で output/records.json に整形してください。候補検出に用いる決定的セレクタを宣言し、抽出できない候補は理由を明記して除外してください。output/report.md に件数と要約を記載してください。\nProfile: ingest\nStyle: default\nIntent: create\nPhase id: pipeline-creation\nPhase task: Create an offline deterministic main.py that reads all HTML files in data/snapshots/, applies explicit CSS selectors to locate event blocks, and extracts name, date (normalized to YYYY-MM-DD), location, and source_file into output/records.json without network access or invented values.\n\nProfile generation rules:\n- Profile ingest: implement an offline deterministic pipeline/main.py over data/snapshots. Declare candidate_selector, candidate_accounting, and record_format in output/inspection.json. Do not invent source values, splice candidate blocks, silently drop candidates, or fetch network data.\n\nDeterministic verification preference:\n- none\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/records.json\n- output/report.md"
steps:
  - id: "inspect-snapshots"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read sample HTML files in data/snapshots/ to identify event block structures, date formats, and location patterns for extraction."
    expected_paths: []
    verify: []
  - id: "implement-pipeline"
    kind: "implement"
