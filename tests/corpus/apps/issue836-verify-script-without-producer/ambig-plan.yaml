goal: "Original ultra goal: ちょっとしたメモアプリを作って。ブラウザで使えるようにしてください。\nProfile: generic\nStyle: default\nIntent: create\nPhase id: setup-project\nPhase task: Initialize the project structure with an index.html, style.css, and script.js file. The HTML should include a text area for input and a list to display saved memos.\n\nWorkspace snapshot:\n- empty or metadata-only\n\nPrior ultra context:\n- none yet\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- adding\n- after\n- allow\n- appealing\n- apply\n- area\n- … and 41 more\n\nProfile generation rules:\n- none\n\nProfile runtime contract:\n- Keep changes scoped to the current phase and workspace.Deterministic verification preference:\n- none\n\n\nRequired final capabilities:\n- generic_interactive_contract\n\nRequired final evidence:\n- user_input_handler_evidence\n- stateful_update_evidence\n- visible_interactive_surface_evidence"
steps:
  - id: "create-base-files"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create index.html with a textarea and a list for memos, style.css for basic layout, and script.js to handle memo addition and storage."
    expected_paths:
      - "index.html"
      - "style.css"
      - "script.js"
    verify:
      - "ls index.html style.css script.js"
  - id: "create-smoke-test"
    kind: "implement"
    expected_result: "pass"
    instruction: "Create a smoke-check.js file that uses a basic environment (or checks file content) to ensure the script.js contains the logic for adding memos to the DOM."
    expected_paths:
      - "smoke-check.js"
    verify:
      - "ls smoke-check.js"
  - id: "verify-functionality"
    kind: "verify"
    expected_result: "pass"
    instruction: "Run the smoke-check.js to verify that the required HTML elements and script functions are correctly defined for a memo app."
    expected_paths:
    verify:
      - "node smoke-check.js"
