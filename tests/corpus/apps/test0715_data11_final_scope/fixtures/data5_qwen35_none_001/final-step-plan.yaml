goal: "Original ultra goal: data/sales.csv を読み込み、月次×地域の売上集計と全体合計を計算し、無効な行は理由別に除外して件数を明記した上で、要約レポートを作成してください。\nProfile: data\nStyle: default\nIntent: create\nPhase id: final-verification-and-cleanup\nPhase task: 生成された要約レポートがタスク要件（月次×地域集計、全体合計、無効行理由別件数明記）をすべて満たしていることを最終確認し、出力ファイルをクリーンな状態に整えてタスクを完了する。\n\nWorkspace snapshot:\n- data\n- evidence\n- output\n- pipeline\n- smoke_check.py\n- verify_checks.py\n\nPrior ultra context:\n- Completed phases:\n  - load-and-validate-sales-data (3/3)\n  - aggregate-monthly-regional-sales (5/5)\n  - generate-summary-report (4/4)\n- Created or changed paths:\n  - pipeline/main.py\n  - smoke_check.py\n  - verify_checks.py\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- クリーン\n- グループ\n- タスク\n- データ\n- ファイル\n\nProfile generation rules:\nThe pipeline must be deterministic: use a fixed seed whenever randomness is unavoidable, do not depend on execution time, and keep iteration and output ordering stable. Derive validation rules only from output/inspection.json observations and never invent unobserved value sets. This is class knowledge required by docs/dev/data-profile-contract.md section 8.\nProfile runtime contract:\n- Generate pipeline/main.py, output/inspection.json, output/results.json, and required output/report.md; output/report.html is optional in addition.\n- Write output/results.json exactly as {\"reconciliation\":{\"input_rows\":N,\"used_rows\":N,\"excluded\":[{\"reason\":\"...\",\"rows\":N}]},\"values\":{\"<claim_key>\":number}} and store every numeric report claim under values.\n- input_rows must equal used_rows plus the sum of excluded rows.\n- A rerun must reproduce the complete output/results.json document exactly; time, random state, and unstable iteration order may not change results.Deterministic verification preference:\n- none\n\n\nRequired final artifacts:\n- pipeline/main.py\n- output/inspection.json\n- output/results.json\n- output/report.md\n\nRequired final capabilities:\n- data_reconciliation\n- data_claims_binding\n- data_rerun_consistency\n- data_inspection_schema\n- data_results_schema"
steps:
  - id: "inspect-report-content"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read output/report.md and assess whether it contains monthly x regional sales aggregation, overall total sales, and invalid row exclusion counts by reason."
    expected_paths:
    verify:
  - id: "inspect-results-schema"
    kind: "inspect"
    expected_result: "pass"
    instruction: "Read output/results.json and assess whether it matches the required schema with reconciliation and values sections, and that all numeric claims in report.md are present in values."
    expected_paths:
    verify:
  - id: "run-verification-suite"
    kind: "verify"
    expected_result: "pass"
    instruction: "Execute the verification script to assert data reconciliation, claim binding, and rerun consistency."
    expected_paths:
    verify:
      - "anvil-catalog-check:data_reconciliation"
      - "anvil-catalog-check:data_rerun_consistency"
  - id: "final-artifact-validation"
    kind: "verify"
    expected_result: "pass"
    instruction: "Confirm all required final artifacts exist and are well-formed JSON or Markdown."
    expected_paths:
    verify:
      - "anvil-catalog-check:data_inspection_schema"
