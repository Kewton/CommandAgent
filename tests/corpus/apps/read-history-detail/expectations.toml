# Issue #1096: when a history cannot be compacted under budget, the overage is recorded as the
# `compaction_over_budget` event through `eval_events::emit` before the request is built, so a GUI
# that keeps only the event file still sees it. The corpus records that the event is declared and
# emitted from the compaction leaf, with numbers only. The behavioural proof that the event lands
# before the provider request is in tests/profile_tool_schema_responses.rs.
../../../../src/minimal_loop/compact.rs = [
  "\"compaction_over_budget\"",
  "crate::eval_events::emit(",
  "\"remaining_chars\"",
  "\"budget_chars\"",
  "\"context_budget\""
]

