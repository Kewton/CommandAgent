case_id = "prefetched-planner-usage"
source = "Issue #948: the speculative next-phase planner pairs each physical prefetch call with its own timing and response metadata, and pairs the adopted reply with the call of the latest client generation rather than the latest started call; the replayed reply's provider_turn_duration carries that call's metadata and counts it once; every physical prefetch call gets exactly one additive speculative_phase_plan_provider_call event, with accounting_record false when replayed and true when unconsumed (discarded, stale, failed, dropped, adopted unreplayed, or cancelled before the replay) or unsettled; a call that would begin after the log closed starts no provider call; the provider-reported billed amount (Issue #947) is counted once, by the turn for a replayed call and by the accounting record for an unconsumed call, as a decimal string; unreported values stay absent and an explicit zero stays 0; the existing speculative_phase_plan_* events keep their base bytes"
