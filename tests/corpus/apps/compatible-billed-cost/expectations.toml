case_id = "compatible-billed-cost"
source = "Issue #947: the shared OpenAI-compatible Chat Completions parser reads the raw usage.cost number token before any f64 conversion and keeps an unsigned token no larger than 2^53-1 (compared in decimal) as the optional ProviderResponseMetadata.billed_cost_usd, a provider-reported USD amount never computed from token counts or a price table; the provider_response and provider_turn_duration events of the same turn both carry it as provider_billed_cost_usd, a JSON string of the exact decimal text sent (\"0.012345\", \"1e-400\", \"1.00000000000000001\"), only when it is reported, so an aggregator reads it as a decimal and counts it once per turn, never adding the two events; an explicit zero is the string \"0\", a missing, null, string, negative (including -0), or out-of-range amount leaves the field absent and every other byte of both events as at the base commit, an amount whose text equals or contains a value registered in the events path's redaction scope is left out of both events as unreported (never a marker, never restored past the scrub, never zero), a number beyond f64 such as 1e400 still fails the whole response parse as at the base commit, and no turn carries a previous turn's amount, on the planner and the executor paths"
