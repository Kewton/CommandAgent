case_id = "compatible-billed-cost"
source = "Issue #947: the shared OpenAI-compatible Chat Completions parser keeps a finite, non-negative, in-range usage.cost as the optional ProviderResponseMetadata.billed_cost_usd, a provider-reported USD amount never computed from token counts or a price table; the provider_response and provider_turn_duration events of the same turn both carry it as the JSON number provider_billed_cost_usd only when it is reported, so an aggregator counts it once per turn and never adds the two events; an explicit zero is the number 0, a missing, null, string, negative, or out-of-range amount leaves the field absent and every other byte of both events as at the base commit, and no turn carries a previous turn's amount, on the planner and the executor paths"
