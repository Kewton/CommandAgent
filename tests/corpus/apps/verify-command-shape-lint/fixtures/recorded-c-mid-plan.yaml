goal: "Original ultra goal: 作業ディレクトリの直下に、Python 3（標準ライブラリだけ）のスクリプト `csv2jsonl.py` を作ってください。\n\n仕様:\n- 使い方: `python3 csv2jsonl.py <入力CSV> <出力JSONL>`\n- 入力は UTF-8・カンマ区切りの CSV で、1 行目は必ず `id,name,price,in_stock`。\n- 出力は JSON Lines（1 行に 1 つの JSON オブジェクト、各行を \\n で終える）で、データ行ごとに 1 行を入力と同じ順に書く。\n- 各列の型:\n  - `id`: 整数（JSON の数値）\n  - `name`: 文字列\n  - `price`: 数値（JSON の数値。`120` も `98.5` も数値にする）\n  - `in_stock`: 真偽値。入力の `true` / `false`（大文字・小文字を問わない）を JSON の true / false にする\n- 出力ファイルは UTF-8 で書く。キーの順序と空白は問わない。\n- 正常に終わったら終了コード 0。\n\n作業ディレクトリの `products.csv` を入力例として使ってかまいません。\nProfile: generic\nStyle: default\nIntent: create\nPhase id: implement-converter\nPhase task: 作業ディレクトリ直下に csv2jsonl.py を作成する。指定された2つの引数を受け取り、UTF-8 CSV の必須ヘッダーを検証し、各データ行を指定の型に変換して UTF-8 の JSONL として入力順に出力する。標準ライブラリのみを使い、正常終了時は終了コード 0 とする。\n\nWorkspace snapshot:\n- products.csv\n\nPrior ultra context:\n- Completed phases:\n  - inspect-input (1/1)\n\nUnmet final requirements from earlier phases:\n- none\n\nRequested features not yet detected:\n- csv\n- csv2jsonl\n- false\n- jsonl\n- price\n- products\n- … and 8 more\n\nProfile generation rules:\n- none\n\nProfile runtime contract:\n- Keep changes scoped to the current phase and workspace.Deterministic verification preference:\n- none\n"
