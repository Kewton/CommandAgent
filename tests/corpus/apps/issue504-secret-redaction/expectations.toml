case_id = "issue504-secret-redaction"
source = "Issue #504: one run-scoped exact-value secret catalog scrubs session/events/summary/evidence/trace, the provider-sent conversation/tool schema, and the display stream callback; a rejected Bash command persists an empty command_prefix_bytes while keeping schema_version/command_sha256/command_bytes; an invalid ${ENV} base_url never echoes its expansion value. Issue #548: a credential value that equals a fixed identifier or is a substring of one is refused at startup in every source; a fixed-key value is preserved only when it is itself a fixed identifier; a numerical YAML secret is detected and scrubbed; an escaped confirmation identity is refused after decoding; YAML mapping/tagged keys keep their element count; the summary protects only fixed machine values"
