[package]
name = "commandagent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first coding agent with verified minimal-loop and structured-plan workflows"
license = "MIT"
repository = "https://github.com/Kewton/CommandAgent"
homepage = "https://github.com/Kewton/CommandAgent"
readme = "README.md"
keywords = ["ai", "coding-agent", "cli", "automation", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/build.rs",
    "/src/**",
]

[workspace]

[features]
default = []
gui = ["dep:axum", "dep:tokio"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
crossterm = { version = "0.28", default-features = false, features = ["events"] }
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
rustyline = { version = "14", default-features = false, features = ["custom-bindings", "with-file-history"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"], optional = true }
toml = "0.8"
unicode-width = "0.1"
url = "2"
uuid = { version = "1", default-features = false, features = ["v7", "std", "serde"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gui_server"
path = "src/bin/gui_server.rs"
required-features = ["gui"]

[[test]]
name = "gui_server"
path = "tests/gui_server.rs"
required-features = ["gui"]
