# Template only: replace every angle-bracketed executor/provider ID with a
# measurement-approved value before execution. The strict parser rejects
# unresolved provider placeholders by design.
workflow: recovery-circle-data-elevated
version: 0.1
entry: create
nodes:
  create: { intent: create, profile: data }
  investigate: { intent: investigate, profile: data, model: <investigate-executor-id>, provider: <investigate-provider-id> }
  fix: { intent: fix, profile: data, model: <fix-executor-id>, provider: <fix-provider-id> }
  verify_origin: { intent: investigate, profile: data }
routes:
  - { from: create, on: failed, when: recovery_yaml_present, to: investigate, carry: [workspace, recovery_yaml] }
  - { from: investigate, on: full, to: fix, carry: [workspace, recovery_yaml, reproducer_lineage] }
  - { from: fix, on: full, to: verify_origin, carry: [workspace, recovery_yaml, reproducer_lineage] }
terminal:
  verify_origin: { on: full, verdict: circle_full }
