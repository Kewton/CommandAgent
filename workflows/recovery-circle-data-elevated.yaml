# Elevated local-planner arm. Executor IDs are fixed by the measurement
# directive; Ollama credentials remain outside YAML and command arguments.
workflow: recovery-circle-data-elevated
version: 0.1
entry: create
nodes:
  create: { intent: create, profile: data }
  investigate: { intent: investigate, profile: data, model: gemma4:31b-cloud, provider: ollama }
  fix: { intent: fix, profile: data, model: gemma4:31b-cloud, provider: ollama }
  verify_origin: { intent: investigate, profile: data }
routes:
  - { from: create, on: failed, when: recovery_yaml_present, to: investigate, carry: [workspace, recovery_yaml, reproducer_suggestion] }
  - { from: investigate, on: full, to: fix, carry: [workspace, recovery_yaml, reproducer_lineage] }
  - { from: fix, on: full, to: verify_origin, carry: [workspace, recovery_yaml, reproducer_lineage] }
terminal:
  verify_origin: { on: full, verdict: circle_full }
