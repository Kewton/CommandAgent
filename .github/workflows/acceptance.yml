name: acceptance

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: |
          # Browser/provider probes are environment-dependent and are not part
          # of this CI job. Keep the explicit list and count visible in logs.
          EXCLUDED_TESTS="browser_probe=0"
          echo "Excluded tests: ${EXCLUDED_TESTS}"
          echo "Excluded test count: 0"
          cargo test --all-targets
      - name: Python checks
        run: |
          python -m pip install --disable-pip-version-check ruff
          ruff check workspace/management/scripts
          python -m unittest discover -s workspace/management/scripts -p 'test_*.py'
      - name: scrub changed files
        run: |
          set -e
          git diff --name-only HEAD^ HEAD | while read -r path; do
            [ -f "$path" ] || continue
            python workspace/management/scripts/bench.py scrub --path "$path"
          done
