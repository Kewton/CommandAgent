name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    name: Detect GUI changes
    runs-on: ubuntu-latest
    outputs:
      gui: ${{ steps.filter.outputs.gui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gui:
              - 'gui/**'
              - 'src/bin/gui_server.rs'
              - 'src/bin/gui_server/**'
              - 'tests/gui_*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  commandagent-guardrails:
    name: CommandAgent Test and Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: actions/setup-node@v5
        with:
          node-version: '24.1.0'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install harness test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements/ci.txt
      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Enable legacy TIOCSTI for the isolation probes
        run: |
          # The runner's kernel may refuse the write (dev.tty.legacy_tiocsti has no
          # namespace, so a container or a locked-down kernel cannot set it). Log the
          # outcome and never fail the job: the probe reports UNVERIFIED in that case.
          sudo sysctl -w dev.tty.legacy_tiocsti=1 || echo "could not write dev.tty.legacy_tiocsti (exit $?): the TIOCSTI probe reports UNVERIFIED"
          sysctl -n dev.tty.legacy_tiocsti || echo "could not read dev.tty.legacy_tiocsti (exit $?)"
      - name: Allow user namespaces for the providerless network guard
        run: |
          # tests/cli_cases/harness.py runs each providerless case in a new user and network
          # namespace (bwrap first, then unshare) so that outside connections are refused.
          # ubuntu-24.04 restricts unprivileged user namespaces through AppArmor, which makes
          # every guard fail. The runner is a VM discarded after each job, so this setting
          # applies to this job only; it follows the dev.tty.legacy_tiocsti step above.
          # The guard and the tests do not run under sudo. If no guard works, the guard
          # fixture still fails the pytest run, so a case is never skipped.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl -n kernel.apparmor_restrict_unprivileged_userns
      - name: Repository acceptance suite
        env:
          COMMANDAGENT_PROBE_VERDICT_FILE: ${{ runner.temp }}/probe-verdicts.txt
        run: bash scripts/ci.sh
      - name: Sandboxed cargo with an external toolchain
        run: |
          # Runs the one ignored test that proves `cargo --version` works through
          # the OS sandbox when the toolchain lives outside $HOME. The toolchain is
          # installed fresh into a directory this step owns (no copy of the runner
          # user's home, no credentials). The shell is `bash -eo pipefail`, so any
          # failing command, a missing toolchain or a test that did not run fails
          # the step; nothing here is `|| true` or continue-on-error.
          toolchain_root=/opt/commandagent-sandbox-toolchain
          sudo mkdir -p "$toolchain_root"
          sudo chown "$(id -u):$(id -g)" "$toolchain_root"
          export RUSTUP_HOME="$toolchain_root/rustup"
          export CARGO_HOME="$toolchain_root/cargo"
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          for dir in "$RUSTUP_HOME" "$CARGO_HOME"; do
            real="$(realpath "$dir")"
            case "$real/" in
              "$(realpath "$HOME")"/*) echo "toolchain dir $real is inside \$HOME" >&2; exit 1 ;;
            esac
          done
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$toolchain_root/rustup-init.sh"
          sh "$toolchain_root/rustup-init.sh" -y --no-modify-path --profile minimal --default-toolchain stable
          test -x "$CARGO_HOME/bin/cargo"
          # Build with the already-installed toolchain, then run the test binary
          # directly so only the test sees the external RUSTUP_HOME/CARGO_HOME.
          unset RUSTUP_HOME CARGO_HOME
          exe="$(cargo test --lib --no-run --message-format=json | jq -r 'select(.profile.test == true and (.target.kind | index("lib"))) | .executable' | tail -n 1)"
          test -n "$exe"
          out="$(RUSTUP_HOME="$toolchain_root/rustup" CARGO_HOME="$toolchain_root/cargo" PATH="$toolchain_root/cargo/bin:$PATH" "$exe" --ignored --exact bounded_process::tests::sandboxed_cargo_runs_with_toolchain_outside_home --nocapture 2>&1)"
          printf '%s\n' "$out"
          # `--exact` with an unmatched name exits 0 with "0 passed": require the one run.
          printf '%s\n' "$out" | grep -q '^test result: ok\. 1 passed; 0 failed'
      - name: Report isolation probe verdicts
        if: always()
        env:
          COMMANDAGENT_PROBE_VERDICT_FILE: ${{ runner.temp }}/probe-verdicts.txt
        run: |
          # A passing test's stdout is captured by cargo test, and $GITHUB_STEP_SUMMARY
          # is not readable through gh or the REST API, so print the verdict file and
          # annotate every UNVERIFIED line. This step fails the job if any probe was
          # UNVERIFIED or if the verdict file is missing or empty.
          bash scripts/check-probe-verdicts.sh

  gui-dashboard:
    name: GUI Dashboard
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install pinned GUI dependencies
        working-directory: gui
        run: npm ci --include=dev
      - name: Audit internal paths
        working-directory: gui
        run: npm run lint
      - name: Type check
        working-directory: gui
        run: npm run typecheck
      - name: Build root-path export
        working-directory: gui
        run: GUI_BASE_PATH=/ npm run build
      - name: Build proxy-path export
        working-directory: gui
        run: GUI_BASE_PATH=/proxy/commandagent/ npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Verify read-only GUI server
        run: |
          cargo clippy --features gui --bin gui_server -- -D warnings
          cargo test --features gui --test gui_server
          cargo test --features gui --bin gui_server
