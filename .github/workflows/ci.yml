name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  commandagent-guardrails:
    name: CommandAgent Test and Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install harness test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements/ci.txt
      - name: Repository acceptance suite
        run: bash scripts/ci.sh
