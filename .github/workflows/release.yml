name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24.1.0'
      - name: Record Node test runtime
        run: node --version
      - uses: dtolnay/rust-toolchain@stable
      - name: Allow user namespaces for the Linux strict isolation tests
        run: |
          # The same preparation as the CI guardrails job: ubuntu-24.04 restricts unprivileged
          # user namespaces through AppArmor, and the strict isolation (#982) needs them. The
          # runner is a VM discarded after the job.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl -n kernel.apparmor_restrict_unprivileged_userns
      - name: Test the release source
        env:
          # With the restriction lifted the backend must work; its tests fail when it does not
          # and when this is unset. Tests read this, never production.
          COMMANDAGENT_TEST_LINUX_STRICT: available
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive and checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="commandagent-${version}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/commandagent" "$staging/commandagent"
          tar -C "$staging" -czf "$archive" commandagent
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            shasum -a 256 "$archive" > "${archive}.sha256"
            shasum -a 256 -c "${archive}.sha256"
          else
            sha256sum "$archive" > "${archive}.sha256"
            sha256sum -c "${archive}.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: commandagent-${{ matrix.target }}
          path: |
            commandagent-*.tar.gz
            commandagent-*.tar.gz.sha256

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: commandagent-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            commandagent-*.tar.gz
            commandagent-*.tar.gz.sha256
