name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive and checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="commandagent-${version}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/commandagent" "$staging/commandagent"
          tar -C "$staging" -czf "$archive" commandagent
          sha256sum "$archive" > "${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          # macOS runners use shasum; keep the portable verification contract visible.
          # macOS equivalent: shasum -a 256 "$archive".
      - uses: actions/upload-artifact@v4
        with:
          name: commandagent-${{ matrix.target }}
          path: |
            commandagent-*.tar.gz
            commandagent-*.tar.gz.sha256

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: commandagent-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Equivalent gh release flags: --generate-notes --prerelease (for UAT tags).
          generate-notes: true
          prerelease: false
          files: |
            commandagent-*.tar.gz
            commandagent-*.tar.gz.sha256
