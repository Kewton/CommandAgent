# .commandmate/verify.yaml -- v1
# Drafted by cmate-verify step 1 from scripts/ci.sh and .github/workflows/.
# Included: scripts/ci.sh (run by ci.yml:55-56 and acceptance.yml:31-32) and the
#           always-on nextjs-domain.yml oracle job.
# Excluded by decision:
#   - .github/workflows/release.yml (tag-triggered build/publish, not a gate)
#   - acceptance.yml "scrub changed files" (post-step mutation, not a verdict)
#   - ci.yml gui-dashboard: conditional on gui/** (ci.yml:61), so it is not declared here
#   - corpus-regression / generality-guardrails / conformance: already run by
#     `cargo test --all-targets` (none of those targets has #[ignore])
version: 1
gates:
  - id: fmt
    command: "cargo fmt --all -- --check"
    timeoutSec: 120
  - id: codex-skills-validate
    command: "python3 scripts/validate_codex_skills.py --tracked-only"
    timeoutSec: 300
  - id: ruff
    command: "ruff check --isolated --select E4,E7,E9,F,I --ignore E402 scripts/codex_orchestrate.py scripts/validate_codex_skills.py tests/test_codex_orchestrate.py workspace/management/scripts"
    timeoutSec: 300
  - id: shellcheck
    command: "shellcheck scripts/*.sh"
    timeoutSec: 300
  - id: pytest-codex-orchestrate
    command: "python3 -m pytest tests/test_codex_orchestrate.py -q"
    timeoutSec: 600
  - id: unittest-management
    command: "python3 -m unittest discover -s workspace/management/scripts -p 'test_*.py'"
    timeoutSec: 600
  - id: eval-acceptance-contract
    command: "python3 tests/eval/test_acceptance_contract.py"
    timeoutSec: 600
  - id: eval-completion-snapshots
    command: "python3 tests/eval/test_completion_contract_snapshots.py"
    timeoutSec: 600
  - id: eval-false-positive-regression
    command: "python3 tests/eval/test_false_positive_regression.py"
    timeoutSec: 600
  - id: clippy
    command: "RUSTFLAGS='-D warnings' cargo clippy --all-targets -- -D warnings"
    timeoutSec: 1800
  - id: test-all-targets
    command: "RUSTFLAGS='-D warnings' cargo test --all-targets"
    timeoutSec: 3600
  - id: nextjs-oracle-ruff
    command: "ruff check --isolated --select E4,E7,E9,F,I --ignore E402 scripts/nextjs_domain_oracle.py tests/test_nextjs_domain_oracle.py"
    timeoutSec: 300
  - id: nextjs-oracle-pytest
    command: "npm ci --ignore-scripts --include=dev --prefix tests/nextjs_domain && python3 -m pytest tests/test_nextjs_domain_oracle.py -q"
    timeoutSec: 900
options:
  baseRef: origin/develop
  skipInPrimaryCheckout: true
  maxLogTailBytes: 8192
  requireCommit: false
  requireEnvClean: false
