# cargo-deny policy for CommandAgent.
#
# Adopted by Issue #524 so the dependency audit cannot silently regress: a new
# advisory, a disallowed license, or a banned crate now fails CI. The existing
# checks (fmt, default clippy, full tests, guardrails) do not look at the
# dependency graph at all.
#
# Checks run: advisories, bans, licenses, sources (the `cargo deny check`
# default set). See docs/dev/dev-guardrails.md for the surrounding CI contract.

[advisories]
# No advisory is ignored. A new advisory must fail the check; add an entry here
# only with a written reason and a link to the tracking Issue.
ignore = []

[licenses]
# Curated allow list matching the current dependency graph. BSL-1.0 is required
# by clipboard-win and error-code (reached through rustyline 14.0.0); Issue #524
# authorises it explicitly, not as a blanket permission.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
# A newly introduced duplicate is reported but does not fail yet.
multiple-versions = "warn"
# A `*` requirement would let an unreviewed version enter the graph silently.
wildcards = "deny"
